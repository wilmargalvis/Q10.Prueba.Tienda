name: q10-orderflow

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-q10}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Set RABBITMQ_ERLANG_COOKIE in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  database-init:
    build:
      context: .
      dockerfile: DatabaseInitializer/Dockerfile
    environment:
      ConnectionStrings__Store: "Server=sqlserver,1433;Database=PruebaQ10Tienda;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      DATABASE_BOOTSTRAP: /app/Database/01_CreateDatabase.sql
      SCHEMA_BOOTSTRAP: /app/Database/02_CreateSchemas.sql
      MIGRATION_OUTPUT: /generated
    volumes:
      - ./Database:/app/Database:ro
      - ./Database/Generated:/generated
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  orders-api:
    build:
      context: .
      dockerfile: Service Orders API/Q10.Prueba.Tienda.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Store: "Server=sqlserver,1433;Database=PruebaQ10Tienda;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USERNAME:-q10}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  inventory-worker:
    build:
      context: .
      dockerfile: Service Inventory Worker/Q10.Prueba.Inventory.Worker/Dockerfile
    environment:
      ConnectionStrings__Store: "Server=sqlserver,1433;Database=PruebaQ10Tienda;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USERNAME:-q10}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      database-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: Frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - orders-api

volumes:
  sqlserver-data:
